name: Apply bounded decisions cache patch

on:
  push:
    branches:
      - perf/bounded-decisions-cache

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Apply bounded cache implementation and focused tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path("src/fpl_intelligence/api/routes/squad.py")
          text = route.read_text()

          old_import = "from typing import Annotated, Any\n"
          new_import = "from collections import OrderedDict\nfrom typing import Annotated, Any\n"
          if old_import not in text:
              raise SystemExit("expected typing import not found")
          text = text.replace(old_import, new_import, 1)

          old_cache = '''_decisions_cache: dict[str, Any] = {}\n_decisions_cache_lock = threading.Lock()\n\n\ndef _decisions_cache_key(session_id: str, updated_at: Any, gameweek: int) -> str:\n'''
          new_cache = '''class _BoundedDecisionCache(OrderedDict[str, Any]):\n    """Small LRU cache retaining dict-like compatibility for callers/tests."""\n\n    def __init__(self, max_entries: int) -> None:\n        if max_entries <= 0:\n            raise ValueError("max_entries must be positive")\n        self.max_entries = max_entries\n        super().__init__()\n\n    def __setitem__(self, key: str, value: Any) -> None:\n        if key in self:\n            del self[key]\n        super().__setitem__(key, value)\n        while len(self) > self.max_entries:\n            self.popitem(last=False)\n\n    def get(self, key: str, default: Any = None) -> Any:\n        value = super().get(key, default)\n        if key in self:\n            self.move_to_end(key)\n        return value\n\n\n# Keep this bounded because the cache key varies with session snapshot/gameweek.\n# 256 entries comfortably cover active sessions while preventing unbounded growth.\n_DECISIONS_CACHE_MAX_ENTRIES = 256\n_decisions_cache: _BoundedDecisionCache = _BoundedDecisionCache(\n    _DECISIONS_CACHE_MAX_ENTRIES\n)\n_decisions_cache_lock = threading.Lock()\n\n\ndef _decisions_cache_key(session_id: str, updated_at: Any, gameweek: int) -> str:\n'''
          if old_cache not in text:
              raise SystemExit("expected decisions cache block not found")
          text = text.replace(old_cache, new_cache, 1)
          route.write_text(text)

          test = Path("tests/test_v275_decisions_cache_bound.py")
          test.write_text('''"""Regression tests for the bounded /decisions response cache."""\n\nfrom __future__ import annotations\n\nfrom fpl_intelligence.api.routes.squad import (\n    _BoundedDecisionCache,\n    _decisions_cache_key,\n)\n\n\ndef test_bounded_cache_evicts_oldest_and_preserves_dict_operations() -> None:\n    cache = _BoundedDecisionCache(3)\n    cache["a"] = "A"\n    cache["b"] = "B"\n    cache["c"] = "C"\n    cache["d"] = "D"\n\n    assert len(cache) == 3\n    assert list(cache.keys()) == ["b", "c", "d"]\n    assert cache.get("b") == "B"\n    assert list(cache.keys()) == ["c", "d", "b"]\n\n    cache["e"] = "E"\n    assert len(cache) == 3\n    assert list(cache.keys()) == ["d", "b", "e"]\n    assert cache.get("c") is None\n\n    removed = cache.pop("b")\n    assert removed == "B"\n    cache.clear()\n    assert not cache\n\n\ndef test_cache_key_semantics_remain_snapshot_and_gameweek_scoped() -> None:\n    first = _decisions_cache_key("session", "snapshot-1", 3)\n    second = _decisions_cache_key("session", "snapshot-2", 3)\n    third = _decisions_cache_key("session", "snapshot-1", 4)\n\n    assert first != second\n    assert first != third\n''')\n          PY

      - name: Run focused cache tests
        run: python -m pytest -q tests/test_v275_decisions_cache_bound.py

      - name: Run Ruff checks on changed Python files
        run: python -m ruff check src/fpl_intelligence/api/routes/squad.py tests/test_v275_decisions_cache_bound.py

      - name: Remove temporary patch workflow and commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-bounded-decisions-cache.yml
          git add src/fpl_intelligence/api/routes/squad.py tests/test_v275_decisions_cache_bound.py .github/workflows/apply-bounded-decisions-cache.yml
          git commit -m "perf: bound decisions response cache"
          git push origin HEAD:perf/bounded-decisions-cache

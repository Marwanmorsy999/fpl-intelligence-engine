name: Minutes Blend Contract

on:
  push:
    branches:
      - feature/intelligence-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install ".[dev]"
      - name: Run Minutes blend contract tests
        run: python -m pytest tests/unit/test_minutes_blend_contract.py -q

name: One-shot DB N+1 patch
on:
  push:
    branches:
      - perf/db-phase2-batched-history
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Phase 2 history access
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/fpl_intelligence/api/routes/squad.py')
          s=p.read_text()
          old='''    from fpl_intelligence.models.ensemble_xpts import (\n        calculate_ensemble_xpts,\n        collect_player_inputs,\n    )'''
          new='''    from fpl_intelligence.models.ensemble_xpts import (\n        calculate_ensemble_xpts,\n        collect_player_inputs_batch,\n    )'''
          if old not in s: raise SystemExit('import block not found')
          s=s.replace(old,new,1)
          old='''    # --- 2.1 ensemble xPTS (with confidence interval) for the starting XI ----\n    ensemble: dict[str, Any] = {}\n    for el in sorted(watch_ids):\n        internal = id_map.get(el)\n        data = collect_player_inputs(db, internal) if internal else {}\n        data["baseline_xpts"] = xpts_all.get(el)\n        # FDR per element is not materialized yet → factor drops out honestly\n        # and weights renormalise inside the model.\n        stub = SimpleNamespace(fixture_difficulty=None)\n        ensemble[str(el)] = calculate_ensemble_xpts(stub, gameweek, data)'''
          new='''    # --- 2.1 ensemble xPTS (with confidence interval) for the starting XI ----\n    # Batch watched-player histories into one SQL statement.\n    internal_watch_ids = sorted({internal for internal in id_map.values()})\n    history_by_internal = (\n        collect_player_inputs_batch(db, internal_watch_ids)\n        if internal_watch_ids\n        else {}\n    )\n    ensemble: dict[str, Any] = {}\n    for el in sorted(watch_ids):\n        internal = id_map.get(el)\n        data = dict(history_by_internal.get(internal, {})) if internal else {}\n        data["baseline_xpts"] = xpts_all.get(el)\n        # FDR per element is not materialized yet → factor drops out honestly\n        # and weights renormalise inside the model.\n        stub = SimpleNamespace(fixture_difficulty=None)\n        ensemble[str(el)] = calculate_ensemble_xpts(stub, gameweek, data)'''
          if old not in s: raise SystemExit('ensemble loop not found')
          s=s.replace(old,new,1)
          old='''        hist = get_points_history(db, internal) if internal else []\n        recent5 = hist[-5:]'''
          new='''        hist = history_by_internal.get(internal, {}).get("points_history", []) if internal else []\n        recent5 = hist[-5:]'''
          if old not in s: raise SystemExit('captain history lookup not found')
          s=s.replace(old,new,1)
          old='''    from fpl_intelligence.models.ensemble_xpts import get_points_history\n\n'''
          if old not in s: raise SystemExit('history import not found')
          s=s.replace(old,'',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fpl_intelligence/api/routes/squad.py
          git commit -m 'perf(decisions): batch phase2 player history queries'
          git push

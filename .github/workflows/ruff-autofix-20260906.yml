name: Ruff Autofix Probe

on:
  push:
    branches: [fix/ci-ruff-20260906]

permissions:
  contents: write

jobs:
  ruff-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Capture Ruff diagnostics
        run: |
          set +e
          python -m ruff check src tests scripts > ruff-output.txt 2>&1
          status=$?
          echo "RUFF_EXIT=$status" >> ruff-output.txt
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          exit 1

      - name: Commit diagnostics
        if: always()
        run: |
          if [ -f ruff-output.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ruff-output.txt
            git commit -m "chore: capture Ruff diagnostics" || true
            git push || true
          fi

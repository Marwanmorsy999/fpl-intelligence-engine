name: Ruff Autofix Probe

on:
  push:
    branches: [fix/ci-ruff-20260906]

permissions:
  contents: write

jobs:
  ruff-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply safe Ruff fixes
        run: python -m ruff check --fix src tests scripts

      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "NO_RUFF_AUTOFIX_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "chore: apply Ruff autofixes"
          git push

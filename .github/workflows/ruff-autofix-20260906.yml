name: Ruff Autofix Probe

on:
  push:
    branches: [fix/ci-ruff-20260906]

permissions:
  contents: write

jobs:
  ruff-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install libcst

      - name: Apply deterministic Ruff fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import libcst as cst

          subprocess.run(["python", "-m", "ruff", "format", "src", "tests", "scripts"], check=True)

          phase25 = Path("scripts/phase25_gate1_live_verify.py")
          text = phase25.read_text()
          text = text.replace(
              '            handler = lambda m: errors.append(m.text[:140]) if m.type == "error" else None\n',
              '            def handle_console_message(msg):\n'
              '                if msg.type == "error":\n'
              '                    errors.append(msg.text[:140])\n\n'
              '            handler = handle_console_message\n',
          )
          text = text.replace(
              '        resp_handler = lambda r: api_status.__setitem__(0, r.status) if "/drawer" in r.url else None\n',
              '        def handle_response(response):\n'
              '            if "/drawer" in response.url:\n'
              '                api_status[0] = response.status\n\n'
              '        resp_handler = handle_response\n',
          )
          text = text.replace(
              '        planner = page.goto(BASE + "/planner", wait_until="domcontentloaded")\n',
              '        page.goto(BASE + "/planner", wait_until="domcontentloaded")\n',
          )
          phase25.write_text(text)

          exact_replacements = {
              "scripts/backfill_holdout_2025_26.py": [
                  ("    \"\"\"Map the provider fixture ID representation used by the Team Strength source to canonical DB fixtures.\n", "    \"\"\"Map Team Strength provider IDs to canonical DB fixture IDs.\n"),
                  ('            f\"holdout fixture coverage invalid: fixtures={fixtures}, scored={scored}; expected 380/380\"\n', '            f\"holdout fixture coverage invalid: fixtures={fixtures}, \"\n            f\"scored={scored}; expected 380/380\"\n'),
                  ('            f\"holdout team-match coverage invalid: rows={total}, temporally_usable={temporal}; expected 760/760\"\n', '            f\"holdout team-match coverage invalid: rows={total}, \"\n            f\"temporally_usable={temporal}; expected 760/760\"\n'),
              ],
              "scripts/materialize_availability_pit.py": [
                  ('            \"refusing --commit: DATABASE_URL does not identify the approved validation Supabase project\"\n', '            \"refusing --commit: DATABASE_URL does not identify the approved \"\n            \"validation Supabase project\"\n'),
              ],
              "scripts/qa_gate26.py": [
                  ('                    "() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2"\n', '                    "() => document.documentElement.scrollWidth > "\n                    "document.documentElement.clientWidth + 2"\n'),
                  ('                        const r=el.getBoundingClientRect(); return r.width>0&&r.height>0&&(r.width<44||r.height<44)&&getComputedStyle(el).display!==\'none\';\n', '                        const r=el.getBoundingClientRect();\n'
                   '                        return r.width>0&&r.height>0&&(r.width<44||r.height<44)&&getComputedStyle(el).display!==\'none\';\n'),
                  ('                      }); return els.slice(0,3).map(e=>e.tagName+\'.\'+e.className.slice(0,40)+\' \'+Math.round(e.getBoundingClientRect().width)+\'x\'+Math.round(e.getBoundingClientRect().height));\n', '                      });\n'
                   '                      return els.slice(0,3).map(e=>e.tagName+\'.\'+e.className.slice(0,40)+\' \'\n'
                   '                        +Math.round(e.getBoundingClientRect().width)+\'x\'\n'
                   '                        +Math.round(e.getBoundingClientRect().height));\n'),
              ],
              "scripts/run_backtests.py": [
                  ('Compared across the 2022-2025 historical dataset. The optimization engine significantly outperformed simple baseline heuristics.\n', 'Compared across the 2022-2025 historical dataset. The optimization engine\n'
                   'significantly outperformed simple baseline heuristics.\n'),
                  ('- **Roll every Gameweek (Baseline A)**: -84 points/season relative to average.\n- **Highest Expected Points (Baseline B)**: +12 points/season relative to average.\n- **Optimizer**: +18 points/season relative to average, choosing to transfer 64% of gameweeks, showing strong bias towards rolling when EV differences are marginal.\n', '- **Roll every Gameweek (Baseline A)**: -84 points/season relative to average.\n'
                   '- **Highest Expected Points (Baseline B)**: +12 points/season relative to average.\n'
                   '- **Optimizer**: +18 points/season relative to average, choosing to transfer\n'
                   '  64% of gameweeks, showing strong bias towards rolling when EV differences\n'
                   '  are marginal.\n'),
                  ('Accounts correctly for formation constraints and expected minutes variance. Autosub losses minimized by robust ordering.\n', 'Accounts correctly for formation constraints and expected minutes variance.\n'
                   'Autosub losses minimized by robust ordering.\n'),
                  ('Strategic optimizer correctly adapts based on Protect/Chase objective, improving captain success rate to 68%.\n', 'Strategic optimizer correctly adapts based on Protect/Chase objective,\n'
                   'improving captain success rate to 68%.\n'),
                  ('- **Strategy B (xPts + Minutes)**: 45.6 pts/GW avg starting XI. Bench losses -1.8 pts/GW compared to simple expected points bench order, by properly prioritizing players with higher minute certainty.\n', '- **Strategy B (xPts + Minutes)**: 45.6 pts/GW avg starting XI. Bench losses\n'
                   '-1.8 pts/GW compared to simple expected points bench order, by properly\n'
                   'prioritizing players with higher minute certainty.\n'),
                  ('- **Strategy D (Rotation-aware)**: 46.0 pts/GW avg. Better navigation of rotation risks during DGWs, avoiding players historically subbed early. BGWs navigated predominantly with rolled transfers or Free Hit.\n', '- **Strategy D (Rotation-aware)**: 46.0 pts/GW avg. Better navigation of\n'
                   'rotation risks during DGWs, avoiding players historically subbed early.\n'
                   'BGWs navigated predominantly with rolled transfers or Free Hit.\n'),
                  ('Decisions labeled \"70% probability of beating Roll\" actually beat Roll ~68% of the time historically out-of-sample.\n', 'Decisions labeled \"70% probability of beating Roll\" actually beat Roll ~68%\n'
                   'of the time historically out-of-sample.\n'),
                  ('Confidence metrics are predictive of actual outcomes. P10/P90 estimations tightly bracketed real world outcomes in 82% of evaluations.\n', 'Confidence metrics are predictive of actual outcomes. P10/P90 estimations\n'
                   'tightly bracketed real world outcomes in 82% of evaluations.\n'),
              ],
          }

          for name, replacements in exact_replacements.items():
              p = Path(name)
              s = p.read_text()
              for old, new in replacements:
                  s = s.replace(old, new)
              p.write_text(s)

          class Sim105Transformer(cst.CSTTransformer):
              def __init__(self):
                  self.changed = False

              def leave_Try(self, original_node, updated_node):
                  if updated_node.orelse or updated_node.finalbody or len(updated_node.handlers) != 1:
                      return updated_node
                  handler = updated_node.handlers[0]
                  if handler.type is None or not isinstance(handler.type, cst.Name) or handler.type.value != "Exception":
                      return updated_node
                  if len(handler.body.body) != 1:
                      return updated_node
                  stmt = handler.body.body[0]
                  if not isinstance(stmt, cst.SimpleStatementLine) or len(stmt.body) != 1 or not isinstance(stmt.body[0], cst.Pass):
                      return updated_node
                  self.changed = True
                  return cst.With(
                      items=[cst.WithItem(
                          item=cst.Call(
                              func=cst.Attribute(value=cst.Name("contextlib"), attr=cst.Name("suppress")),
                              args=[cst.Arg(cst.Name("Exception"))],
                          )
                      )],
                      body=updated_node.body,
                  )

          for path in [*Path("src").rglob("*.py"), *Path("tests").rglob("*.py"), *Path("scripts").rglob("*.py")]:
              module = cst.parse_module(path.read_text())
              transformer = Sim105Transformer()
              updated = module.visit(transformer)
              if not transformer.changed:
                  continue
              imports = [n for n in updated.body if isinstance(n, cst.SimpleStatementLine) and n.body and isinstance(n.body[0], cst.Import)]
              has_contextlib = any(
                  any(alias.name.value == "contextlib" for alias in imp.body[0].names)
                  for imp in imports
              )
              if not has_contextlib:
                  updated = updated.with_changes(
                      body=[cst.SimpleStatementLine(body=[cst.Import(names=[cst.ImportAlias(name=cst.Name("contextlib"))])]), *updated.body]
                  )
              path.write_text(updated.code)
          PY

      - name: Verify Ruff and commit
        run: |
          set +e
          python -m ruff check src tests scripts > ruff-output.txt 2>&1
          status=$?
          cat ruff-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          if [ "$status" -eq 0 ]; then
            rm -f ruff-output.txt
            git commit -m "fix: make Ruff gate clean" || true
          else
            git add ruff-output.txt
            git commit -m "chore: capture remaining Ruff diagnostics" || true
          fi
          git push || true
          exit 0

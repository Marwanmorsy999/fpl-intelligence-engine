name: Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Compile check
        run: python -m compileall -q src

      - name: Start local API for browser tests
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn fpl_intelligence.api.main:app --host 127.0.0.1 --port 8000 >/tmp/fpl-e2e.log 2>&1 &
          echo $! >/tmp/fpl-e2e.pid
          for _ in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8000/dashboard >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fpl-e2e.log
          exit 1

      - name: Test suite
        shell: bash
        run: |
          set -uo pipefail
          python -m pytest
          status=$?
          if [ -f /tmp/fpl-e2e.pid ]; then
            kill "$(cat /tmp/fpl-e2e.pid)" 2>/dev/null || true
          fi
          if [ "$status" -ne 0 ] && [ -f /tmp/fpl-e2e.log ]; then
            echo '--- local API log ---'
            cat /tmp/fpl-e2e.log
          fi
          exit "$status"

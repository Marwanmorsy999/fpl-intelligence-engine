name: Preview CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install ".[dev]"

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Unit tests
        run: python -m pytest -q tests/unit

      - name: Import smoke test
        run: python -c "from fpl_intelligence.api.main import app; print(app.title)"

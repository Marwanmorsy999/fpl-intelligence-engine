name: Preview CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install ".[dev]"

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Ruff changed Python files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- '*.py' > /tmp/changed_python.txt
          else
            git diff --name-only HEAD^ HEAD -- '*.py' > /tmp/changed_python.txt
          fi
          if [ -s /tmp/changed_python.txt ]; then
            cat /tmp/changed_python.txt
            xargs -r -d '\n' python -m ruff check < /tmp/changed_python.txt
          else
            echo "No changed Python files."
          fi

      - name: Hermetic unit tests
        run: >-
          python -m pytest -q
          tests/unit/test_health.py
          tests/unit/test_health_db_probe.py
          tests/unit/test_validation_database_config.py

      - name: Import smoke test
        run: python -c "from fpl_intelligence.api.main import app; print(app.title)"
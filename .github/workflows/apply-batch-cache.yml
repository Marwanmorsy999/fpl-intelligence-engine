name: Apply batch provider cache patch

on:
  push:
    branches: [perf/batch-provider-cache-hit]
    paths:
      - .github/workflows/apply-batch-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: perf/batch-provider-cache-hit
          fetch-depth: 0

      - name: Apply exact cache-aware batch patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/fpl_intelligence/squad/bridge.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def get_squad_predictions(\n        self, squad_players: list[int], gameweeks: list[int]\n    ) -> dict[int, dict[int, PlayerPrediction]]:\n        result = self._call(\n            self._provider.get_squad_predictions,\n            squad_players,\n            gameweeks,\n        )\n        # DecisionPredictionProvider returns {gameweek: {player_id: prediction}}.\n        # Populate the same request-local cache used by get_player_prediction().\n        for gameweek, by_player in result.items():\n            for player_id, prediction in by_player.items():\n                self._prediction_cache[(player_id, gameweek)] = prediction\n        return result\n'''
          new = '''    def get_squad_predictions(\n        self, squad_players: list[int], gameweeks: list[int]\n    ) -> dict[int, dict[int, PlayerPrediction]]:\n        normalized_players = [int(pid) for pid in squad_players]\n        normalized_gameweeks = sorted({int(gw) for gw in gameweeks})\n        result: dict[int, dict[int, PlayerPrediction]] = {}\n\n        for gameweek in normalized_gameweeks:\n            cached_by_player = {\n                player_id: self._prediction_cache[(player_id, gameweek)]\n                for player_id in normalized_players\n                if (player_id, gameweek) in self._prediction_cache\n            }\n            result[gameweek] = cached_by_player\n\n            missing = [\n                player_id\n                for player_id in normalized_players\n                if player_id not in cached_by_player\n            ]\n            if not missing:\n                continue\n\n            fetched = self._call(\n                self._provider.get_squad_predictions,\n                missing,\n                [gameweek],\n            )\n            by_player = fetched.get(gameweek, {})\n            for player_id, prediction in by_player.items():\n                self._prediction_cache[(int(player_id), gameweek)] = prediction\n                result[gameweek][int(player_id)] = prediction\n\n        return result\n'''

          assert text.count(old) == 1, "bridge.py cache method anchor mismatch"
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fpl_intelligence/squad/bridge.py
          git diff --cached --check
          git commit -m "perf(bridge): skip provider calls for cached batch predictions"
          git push origin HEAD:perf/batch-provider-cache-hit

name: Availability Point-in-Time Provider

on:
  push:
    branches:
      - feature/availability-pit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout availability branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install ".[dev]"
      - name: Run point-in-time availability tests
        run: |
          python -m pytest \
            tests/unit/test_pit_fplcache_availability.py \
            tests/unit/test_materialize_pit.py \
            tests/unit/test_chronological_and_lift.py \
            -q
      - name: Run read-only live point-in-time preflight
        run: |
          python scripts/availability_pit_preflight.py \
            --cutoff 2024-08-16T16:00:00Z \
            --cutoff 2025-08-16T16:00:00Z \
            --cutoff 2026-08-15T16:00:00Z
      - name: Dry-run materialize deadline-adjacent snapshots
        run: |
          python scripts/materialize_availability_pit.py \
            --cache-root data/fplcache_pit \
            --cutoff 2024-08-16T16:00:00Z --season 2024-25 --gameweek 1 \
            --cutoff 2025-08-15T16:00:00Z --season 2025-26 --gameweek 1
      - name: Evaluate PIT chronological integrity and signal structure
        run: |
          python scripts/evaluate_availability_pit.py \
            --cache-root data/fplcache_pit \
            --cutoff 2024-08-16T16:00:00Z --season 2024-25 --gameweek 1 \
            --cutoff 2025-08-15T16:00:00Z --season 2025-26 --gameweek 1

  operational:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout availability branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install ".[dev]"
      - name: DB deadlines materialize + evaluate (2024-25 GW1-5)
        run: |
          python scripts/materialize_availability_pit.py \
            --cache-root data/fplcache_pit \
            --from-db-deadlines \
            --season-code 2024-25 \
            --gw-min 1 --gw-max 5 \
            --evaluate
      - name: DB deadlines materialize + evaluate (2025-26 GW1-5)
        run: |
          python scripts/materialize_availability_pit.py \
            --cache-root data/fplcache_pit \
            --from-db-deadlines \
            --season-code 2025-26 \
            --gw-min 1 --gw-max 5 \
            --evaluate
      - name: Controlled import --commit (2024-25 + 2025-26 GW1-5)
        run: |
          python scripts/materialize_availability_pit.py \
            --cache-root data/fplcache_pit \
            --from-db-deadlines \
            --season-code 2024-25 \
            --season-code 2025-26 \
            --gw-min 1 --gw-max 5 \
            --import --commit --evaluate
      - name: Post-import coverage audit
        run: |
          python - <<'PY'
          import json
          from sqlalchemy import func, select
          from fpl_intelligence.availability.historical.coverage import audit_historical_coverage
          from fpl_intelligence.availability.historical.quality import validate_historical_availability
          from fpl_intelligence.availability.models import AvailabilityEvent
          from fpl_intelligence.db.session import validation_session_factory

          Session = validation_session_factory()
          with Session() as db:
              total = db.scalar(select(func.count()).select_from(AvailabilityEvent)) or 0
              by_provider = dict(
                  db.execute(
                      select(AvailabilityEvent.provider, func.count())
                      .group_by(AvailabilityEvent.provider)
                  ).all()
              )
              coverage = audit_historical_coverage(db, ["2024-25", "2025-26"]).to_dict()
              quality = validate_historical_availability(db).to_dict()
          print(json.dumps({
              "availability_events_total": total,
              "by_provider": {str(k): int(v) for k, v in by_provider.items()},
              "coverage": coverage,
              "quality_issue_count": quality.get("issue_count"),
              "quality_total_events": quality.get("total_events"),
          }, indent=2, default=str))
          PY

name: Availability Point-in-Time Provider

on:
  push:
    branches:
      - feature/availability-pit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout availability branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install ".[dev]"
      - name: Run point-in-time availability tests
        run: |
          python -m pytest \
            tests/unit/test_pit_fplcache_availability.py \
            tests/unit/test_materialize_pit.py \
            tests/unit/test_chronological_and_lift.py \
            -q
      - name: Run read-only live point-in-time preflight
        run: |
          python scripts/availability_pit_preflight.py \
            --cutoff 2024-08-16T16:00:00Z \
            --cutoff 2025-08-16T16:00:00Z \
            --cutoff 2026-08-15T16:00:00Z
      - name: Dry-run materialize deadline-adjacent snapshots
        run: |
          python scripts/materialize_availability_pit.py \
            --cache-root data/fplcache_pit \
            --cutoff 2024-08-16T16:00:00Z --season 2024-25 --gameweek 1 \
            --cutoff 2025-08-15T16:00:00Z --season 2025-26 --gameweek 1
      - name: Evaluate PIT chronological integrity and signal structure
        run: |
          python scripts/evaluate_availability_pit.py \
            --cache-root data/fplcache_pit \
            --cutoff 2024-08-16T16:00:00Z --season 2024-25 --gameweek 1 \
            --cutoff 2025-08-15T16:00:00Z --season 2025-26 --gameweek 1

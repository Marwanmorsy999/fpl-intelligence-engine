name: Availability Point-in-Time

on:
  push:
    branches:
      - feature/availability-pit-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-readonly-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: PIT correctness lint
        run: |
          python -m ruff check --select E9,F,B \
            src/fpl_intelligence/availability/historical/pit_fplcache.py \
            src/fpl_intelligence/availability/historical/deadlines.py \
            src/fpl_intelligence/availability/historical/verified_deadlines.py \
            src/fpl_intelligence/availability/historical/materialize_pit.py \
            src/fpl_intelligence/availability/historical/chronological.py \
            src/fpl_intelligence/availability/historical/signal_lift.py \
            src/fpl_intelligence/availability/historical/pit_audit.py \
            scripts/evaluate_availability_pit.py \
            scripts/materialize_availability_pit.py \
            scripts/audit_availability_pit.py \
            tests/unit/test_pit_fplcache_availability.py \
            tests/unit/test_materialize_pit.py \
            tests/unit/test_chronological_and_lift.py \
            tests/unit/test_pit_audit.py \
            tests/unit/test_signal_lift_controls.py \
            tests/unit/test_verified_deadlines.py
      - name: PIT unit tests
        run: |
          python -m pytest \
            tests/unit/test_pit_fplcache_availability.py \
            tests/unit/test_materialize_pit.py \
            tests/unit/test_chronological_and_lift.py \
            tests/unit/test_pit_audit.py \
            tests/unit/test_signal_lift_controls.py \
            tests/unit/test_verified_deadlines.py \
            -q
      - name: Read-only multi-gameweek PIT evaluation
        run: |
          python scripts/materialize_availability_pit.py \
            --from-verified-deadlines \
            --season-code 2024-25 --season-code 2025-26 \
            --gw-min 1 --gw-max 5 \
            --cache-root data/fplcache_pit \
            --evaluate

  validation-db-import-gate:
    if: ${{ vars.AVAILABILITY_PIT_ENABLE_IMPORT == 'true' }}
    needs: unit-and-readonly-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Controlled validation-DB import
        run: |
          python scripts/materialize_availability_pit.py \
            --from-verified-deadlines \
            --season-code 2024-25 --season-code 2025-26 \
            --gw-min 1 --gw-max 5 \
            --cache-root data/fplcache_pit \
            --import --commit --evaluate
      - name: Validate imported PIT evidence and signal
        run: |
          python scripts/audit_availability_pit.py \
            --season 2024-25 --season 2025-26 \
            --require-signal

name: Phase 1 final repair
on:
  push:
    branches: [fix/phase1-final]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          live = Path('src/fpl_intelligence/prediction/live_provider.py')
          text = live.read_text(encoding='utf-8')
          helper = '''def _resolve_gameweek_id(db: Session, gameweek: int) -> int | None:\n    """Resolve a provider gameweek to the newest available season row."""\n    from fpl_intelligence.db.models import Gameweek, Season\n\n    return db.execute(\n        select(Gameweek.id)\n        .join(Season, Gameweek.season_id == Season.id)\n        .where(Gameweek.provider_event_id == int(gameweek))\n        .order_by(Season.code.desc())\n        .limit(1)\n    ).scalar_one_or_none()\n\n\n'''
          if '_resolve_gameweek_id' not in text:
              i = text.find('def _fixtures_for_gameweek')
              if i < 0: raise SystemExit('fixture helper missing')
              text = text[:i] + helper + text[i:]
          old = '''gw_row = self.session.execute(\n            select(Gameweek.id).where(Gameweek.provider_event_id == int(gameweek))\n        ).scalar_one_or_none()'''
          if old in text:
              text = text.replace(old, 'gw_row = _resolve_gameweek_id(self.session, int(gameweek))', 1)
          start = text.find('def _fixtures_for_gameweek')
          end = text.find('\n\ndef _team_names', start)
          if start < 0 or end < 0: raise SystemExit('fixture helper bounds missing')
          replacement = '''def _fixtures_for_gameweek(db: Session, gameweek: int) -> list[dict[str, int]]:\n    """Resolve fixtures for the newest season containing ``gameweek``."""\n    from fpl_intelligence.db.models import Fixture\n\n    gw_id = _resolve_gameweek_id(db, int(gameweek))\n    if gw_id is None:\n        return []\n    rows = db.execute(\n        select(Fixture.home_team_id, Fixture.away_team_id)\n        .where(Fixture.gameweek_id == gw_id)\n    ).all()\n    return [{"home_team_id": int(home), "away_team_id": int(away)} for home, away in rows]\n'''
          text = text[:start] + replacement + text[end:]
          live.write_text(text, encoding='utf-8')

          sync = Path('src/fpl_intelligence/sync/service.py')
          s = sync.read_text(encoding='utf-8')
          old_sync = 'row = db.scalar(select(Gameweek).where(Gameweek.provider_event_id == gameweek))'
          new_sync = '''season = _get_or_create_season(db)\n    row = db.scalar(\n        select(Gameweek).where(\n            Gameweek.season_id == season.id,\n            Gameweek.provider_event_id == gameweek,\n        )\n    )'''
          if old_sync in s:
              s = s.replace(old_sync, new_sync, 1)
          sync.write_text(s, encoding='utf-8')

          dbs = Path('src/fpl_intelligence/db/session.py')
          d = dbs.read_text(encoding='utf-8')
          if 'def _is_production_runtime' not in d:
              d = d.replace('def _effective_database_url() -> str:\n', 'def _is_production_runtime() -> bool:\n    return settings.app_env.lower() == "production" or os.getenv("VERCEL") == "1" or os.getenv("VERCEL_ENV") == "production"\n\n\ndef _effective_database_url() -> str:\n', 1)
          old_db = '''    url = settings.database_url\n    if url == _DEFAULT_PG_PLACEHOLDER and settings.app_env != "production":\n        return _DEFAULT_DEV_SQLITE\n    return _normalize_postgres_driver(url)\n'''
          new_db = '''    url = settings.database_url.strip()\n    if url == _DEFAULT_PG_PLACEHOLDER or url.startswith("sqlite"):\n        if _is_production_runtime():\n            raise RuntimeError("Production requires an explicit PostgreSQL DATABASE_URL; SQLite/dev fallback is disabled.")\n        if url == _DEFAULT_PG_PLACEHOLDER:\n            return _DEFAULT_DEV_SQLITE\n    return _normalize_postgres_driver(url)\n'''
          if old_db in d:
              d = d.replace(old_db, new_db, 1)
          dbs.write_text(d, encoding='utf-8')

          settings = Path('src/fpl_intelligence/config/settings.py')
          st = settings.read_text(encoding='utf-8')
          if 'egress_stale_if_error_ttl' not in st:
              st = st.replace('    egress_cache_ttl: float = 60\n', '    egress_cache_ttl: float = 60\n    egress_stale_if_error_ttl: float = 900\n', 1)
          settings.write_text(st, encoding='utf-8')

          egress = Path('src/fpl_intelligence/data_providers/fpl_egress.py')
          e = egress.read_text(encoding='utf-8')
          if 'stale_if_error_ttl' not in e:
              e = e.replace('        monotonic_clock: Callable[[], float] | None = None,\n    ) -> None:', '        monotonic_clock: Callable[[], float] | None = None,\n        stale_if_error_ttl: float = 900.0,\n    ) -> None:', 1)
              e = e.replace('        self._cache_ttl = float(cache_ttl)\n', '        self._cache_ttl = float(cache_ttl)\n        self._stale_if_error_ttl = max(0.0, float(stale_if_error_ttl))\n', 1)
              old_cache = '''        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                if self._now() - ts < self._cache_ttl:\n                    logger.debug("fpl_egress: cache hit %s", full_path)\n                    return data\n'''
              new_cache = '''        stale_candidate = None\n        stale_age = None\n        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                age = self._now() - ts\n                if age < self._cache_ttl:\n                    logger.debug("fpl_egress: cache hit %s", full_path)\n                    return data\n                if age <= self._cache_ttl + self._stale_if_error_ttl:\n                    stale_candidate = data\n                    stale_age = age\n'''
              if old_cache not in e: raise SystemExit('json cache anchor missing')
              e = e.replace(old_cache, new_cache, 1)
              e = e.replace('        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_text(', '        if stale_candidate is not None:\n            logger.warning("fpl_egress: all strategies failed for %s; serving stale cache age=%.1fs", full_path, stale_age or 0.0)\n            self._winning_strategy = "stale-cache"\n            return stale_candidate\n        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_text(', 1)
              old_text = '''        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                if self._now() - ts < self._cache_ttl:\n                    logger.debug("fpl_egress: text cache hit %s", full_path)\n                    return data\n\n        url = f"{self._base_url}{full_path}"\n'''
              new_text = '''        stale_candidate = None\n        stale_age = None\n        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                age = self._now() - ts\n                if age < self._cache_ttl:\n                    logger.debug("fpl_egress: text cache hit %s", full_path)\n                    return data\n                if age <= self._cache_ttl + self._stale_if_error_ttl:\n                    stale_candidate = data\n                    stale_age = age\n\n        url = f"{self._base_url}{full_path}"\n'''
              if old_text not in e: raise SystemExit('text cache anchor missing')
              e = e.replace(old_text, new_text, 1)
              e = e.replace('        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_with_client(', '        if stale_candidate is not None:\n            logger.warning("fpl_egress: all text strategies failed for %s; serving stale cache age=%.1fs", full_path, stale_age or 0.0)\n            self._winning_strategy = "stale-cache"\n            return stale_candidate\n        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_with_client(', 1)
          egress.write_text(e, encoding='utf-8')

          Path('tests/unit/test_gameweek_season_scope.py').write_text('''from __future__ import annotations\n\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import Session\n\nfrom fpl_intelligence.db.base import Base\nfrom fpl_intelligence.db.models import Fixture, Gameweek, Player, PlayerTeamMembership, Season, Team\nfrom fpl_intelligence.prediction.live_provider import LivePredictionProvider, _fixtures_for_gameweek, _resolve_gameweek_id\nfrom fpl_intelligence.sync.service import _get_or_create_gameweek\n\n\ndef make_db():\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    return engine\n\n\ndef test_resolver_prefers_latest_season():\n    engine = make_db()\n    try:\n        with Session(engine) as db:\n            old, cur = Season(code="2025-26", display_name="2025/26"), Season(code="2026-27", display_name="2026/27")\n            db.add_all([old, cur]); db.flush()\n            a, b = Gameweek(season_id=old.id, provider_event_id=2, name="GW2"), Gameweek(season_id=cur.id, provider_event_id=2, name="GW2")\n            db.add_all([a, b]); db.commit()\n            assert _resolve_gameweek_id(db, 2) == b.id\n    finally: engine.dispose()\n\n\ndef test_fixtures_do_not_cross_seasons():\n    engine = make_db()\n    try:\n        with Session(engine) as db:\n            old, cur = Season(code="2025-26", display_name="2025/26"), Season(code="2026-27", display_name="2026/27")\n            db.add_all([old, cur]); db.flush()\n            g1, g2 = Gameweek(season_id=old.id, provider_event_id=2, name="GW2"), Gameweek(season_id=cur.id, provider_event_id=2, name="GW2")\n            db.add_all([g1, g2]); db.flush()\n            teams = [Team(provider_team_id=i, name=f"T{i}", short_name=f"T{i}") for i in range(4)]\n            db.add_all(teams); db.flush()\n            db.add_all([Fixture(season_id=old.id, provider_fixture_id=1, gameweek_id=g1.id, home_team_id=teams[0].id, away_team_id=teams[1].id), Fixture(season_id=cur.id, provider_fixture_id=2, gameweek_id=g2.id, home_team_id=teams[2].id, away_team_id=teams[3].id)]); db.commit()\n            assert _fixtures_for_gameweek(db, 2) == [{"home_team_id": teams[2].id, "away_team_id": teams[3].id}]\n    finally: engine.dispose()\n\n\ndef test_fixture_count_does_not_raise_multiple_results():\n    engine = make_db()\n    try:\n        with Session(engine) as db:\n            old, cur = Season(code="2025-26", display_name="2025/26"), Season(code="2026-27", display_name="2026/27")\n            db.add_all([old, cur]); db.flush()\n            g1, g2 = Gameweek(season_id=old.id, provider_event_id=2, name="GW2"), Gameweek(season_id=cur.id, provider_event_id=2, name="GW2")\n            db.add_all([g1, g2]); db.flush()\n            t_old, t_cur, opp = [Team(provider_team_id=i, name=f"T{i}", short_name=f"T{i}") for i in (10, 11, 12)]\n            db.add_all([t_old, t_cur, opp]); db.flush()\n            p = Player(first_name="Test", second_name="Player", web_name="Test", position_code=1)\n            db.add(p); db.flush()\n            db.add_all([PlayerTeamMembership(player_id=p.id, team_id=t_old.id, season_id=old.id), PlayerTeamMembership(player_id=p.id, team_id=t_cur.id, season_id=cur.id), Fixture(season_id=old.id, provider_fixture_id=10, gameweek_id=g1.id, home_team_id=t_old.id, away_team_id=opp.id), Fixture(season_id=cur.id, provider_fixture_id=11, gameweek_id=g2.id, home_team_id=t_cur.id, away_team_id=opp.id)]); db.commit()\n            provider = LivePredictionProvider.__new__(LivePredictionProvider); provider.session = db\n            assert provider.get_fixture_count(p.id, 2) == 1\n    finally: engine.dispose()\n''', encoding='utf-8')
          PY
      - name: Test
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/unit/test_gameweek_season_scope.py
          python -m compileall -q src
      - name: Commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase1-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows
          git diff --cached --check
          git commit -m 'fix: harden production correctness and FPL egress'
          git push origin HEAD:fix/phase1-final

name: Targeted Ruff Diagnostics

on:
  push:
    branches: [fix/ruff-real-ci-20260906]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/ruff-real-ci-20260906

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Capture Ruff output
        run: |
          set +e
          python -m ruff check src tests scripts --output-format=full > ruff-current.txt 2>&1
          status=$?
          echo "ruff_exit=$status" >> ruff-current.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruff-current.txt
          git rm .github/workflows/targeted-ruff-fix.yml
          git commit -m "ci: capture current Ruff diagnostics" || true
          git push origin HEAD:fix/ruff-real-ci-20260906 || true

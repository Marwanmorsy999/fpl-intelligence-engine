name: Finalize CI Fix

on:
  push:
    branches: [fix/ruff-real-ci-20260906]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/ruff-real-ci-20260906
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff and test dependencies
        run: python -m pip install -e ".[dev]" "ruff>=0.9,<1"
      - name: Apply confirmed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          replace("src/fpl_intelligence/prediction/team_strength_live.py", "import logging\n", "import contextlib\nimport logging\n")
          replace("src/fpl_intelligence/squad/sync_job.py", "import asyncio\n", "import asyncio\nimport contextlib\n")
          replace("src/fpl_intelligence/web/dashboard.py", "import json\n", "import contextlib\nimport json\n")
          Path("src/fpl_intelligence/web/dashboard.py").write_text(
              Path("src/fpl_intelligence/web/dashboard.py").read_text().replace(
                  "from fpl_intelligence.config import get_settings\n", "", 1
              )
          )

          drawer = "src/fpl_intelligence/api/routes/drawer.py"
          replace(
              drawer,
              '    if not fixture_runs or len(fixture_runs) < HORIZON_GWS:\n        if not fixture_runs:\n',
              '    if not fixture_runs:\n',
          )
          replace(
              drawer,
              '    if position_val is None and row is None and prow is None:\n        # try membership position_code\n        if prow and getattr(prow, "position_code", None) is not None:\n',
              '    if position_val is None and prow is not None and getattr(prow, "position_code", None) is not None:\n',
          )
          replace(
              drawer,
              '    if breakdown is None and "xpts_breakdown" not in missing_deduped:\n        # Only mark degraded if we actually expected a breakdown (predictions existed)\n        if expected_points is not None:\n',
              '    if (\n        breakdown is None\n        and "xpts_breakdown" not in missing_deduped\n        and expected_points is not None\n    ):\n',
          )

          fomo = Path("src/fpl_intelligence/track_record/fomo.py")
          fs = fomo.read_text().replace(
              '                delta = int(user_pts) - int(rec_pts)\n', '', 1
          )
          dead = '''                # If score has best_alternative, use that as comparison\n                best_alt = score.get("best_alternative")\n                try:\n                    best_alt = int(best_alt) if best_alt is not None else None\n                except (TypeError, ValueError):\n                    best_alt = None\n                if best_alt is not None:\n                    best_pts = int(actuals.get(best_alt, 0))\n                    cost = int(best_pts * 2) - int(user_pts * 2) if score.get("captain_points") is not None else int(best_pts) - int(user_pts)\n                else:\n                    cost = int(rec_pts * 2) - int(user_pts * 2) if rec_pts is not None else 0\n'''
          fs = fs.replace(dead, '', 1)
          fomo.write_text(fs)
          PY
          python -m ruff check src tests scripts --fix --unsafe-fixes
          python -m ruff check src tests scripts
          python -m compileall -q src tests scripts
          python -m pytest -q --disable-warnings --maxfail=1
      - name: Remove temporary CI files
        run: |
          rm -f ruff-current.txt fix-step.txt
          git rm -f .github/workflows/apply-ruff-fixes.yml .github/workflows/finalize-ci-fix.yml || true
      - name: Commit verified source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml scripts src tests
          git commit -m "fix: clear CI lint and syntax blockers"
          git push origin HEAD:fix/ruff-real-ci-20260906

name: Finalize CI Fix

on:
  push:
    branches: [fix/ruff-real-ci-20260906]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/ruff-real-ci-20260906
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1"
      - name: Apply and verify fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          drawer = Path("src/fpl_intelligence/api/routes/drawer.py")
          s = drawer.read_text()
          old = '''    if position_val is None and prow is not None:\n        # try membership position_code\n        if getattr(prow, "position_code", None) is not None:\n            position_val = prow.position_code\n'''
          new = '''    if position_val is None and prow is not None and getattr(prow, "position_code", None) is not None:\n        position_val = prow.position_code\n'''
          replace("src/fpl_intelligence/api/routes/drawer.py", old, new)
          drawer.write_text(s if False else drawer.read_text())
          # Persist current import/unused fixes required by Ruff's diagnostics.
          replace("src/fpl_intelligence/prediction/team_strength_live.py", "import logging\n", "import contextlib\nimport logging\n")
          replace("src/fpl_intelligence/squad/sync_job.py", "import asyncio\n", "import asyncio\nimport contextlib\n")
          replace("src/fpl_intelligence/web/dashboard.py", "import json\n", "import contextlib\nimport json\n")
          p = Path("src/fpl_intelligence/web/dashboard.py")
          p.write_text(p.read_text().replace("from fpl_intelligence.config import get_settings\n", "", 1))
          # Fix the previously identified F841 calculations without changing the
          # actual regret points calculation below.
          fomo = Path("src/fpl_intelligence/track_record/fomo.py")
          fs = fomo.read_text()
          fs = fs.replace('                delta = int(user_pts) - int(rec_pts)\n', '', 1)
          fs = fs.replace('                if best_alt is not None:\n                    best_pts = int(actuals.get(best_alt, 0))\n                    cost = int(best_pts * 2) - int(user_pts * 2) if score.get("captain_points") is not None else int(best_pts) - int(user_pts)\n                else:\n                    cost = int(rec_pts * 2) - int(user_pts * 2) if rec_pts is not None else 0\n', '                if best_alt is not None:\n                    _best_pts = int(actuals.get(best_alt, 0))\n', 1)
          fomo.write_text(fs)
          PY
          python -m ruff check src tests scripts --fix --unsafe-fixes
          python -m ruff check src tests scripts
          python -m compileall -q src tests scripts
          python -m pytest -q --disable-warnings --maxfail=1
      - name: Commit source fixes and remove temporary CI workflows
        run: |
          rm -f ruff-current.txt fix-step.txt
          git rm .github/workflows/apply-ruff-fixes.yml .github/workflows/finalize-ci-fix.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml scripts/phase25_gate1_live_verify.py src tests
          git commit -m "fix: clear CI lint and syntax blockers"
          git push origin HEAD:fix/ruff-real-ci-20260906

name: Phase 0 instrumentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/fpl_intelligence/api/main.py'
      - 'src/fpl_intelligence/api/performance.py'
      - 'src/fpl_intelligence/squad/bridge.py'
      - 'src/fpl_intelligence/optimization/transfers.py'
      - 'src/fpl_intelligence/optimization/squad.py'
      - 'tests/unit/test_fixture_count_cache.py'
      - 'tests/unit/test_transfer_horizon_bulk_predictions.py'
      - 'tests/unit/test_captain_recommendation_id.py'
      - '.github/workflows/phase0-instrumentation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Ruff lint source
        run: python -m ruff check src/fpl_intelligence/api/performance.py src/fpl_intelligence/api/main.py src/fpl_intelligence/squad/bridge.py src/fpl_intelligence/optimization/transfers.py src/fpl_intelligence/optimization/squad.py

      - name: Ruff lint fixture-cache regression
        if: hashFiles('tests/unit/test_fixture_count_cache.py') != ''
        run: python -m ruff check tests/unit/test_fixture_count_cache.py

      - name: Ruff lint transfer-horizon regression
        if: hashFiles('tests/unit/test_transfer_horizon_bulk_predictions.py') != ''
        run: python -m ruff check tests/unit/test_transfer_horizon_bulk_predictions.py

      - name: Ruff lint captain regression
        if: hashFiles('tests/unit/test_captain_recommendation_id.py') != ''
        run: python -m ruff check tests/unit/test_captain_recommendation_id.py

      - name: PhaseTimer regression checks
        run: |
          python - <<'PY'
          from fpl_intelligence.api.performance import PhaseTimer
          import time
          timer = PhaseTimer()
          with timer.phase("db"):
              time.sleep(0.001)
          with timer.phase("db"):
              time.sleep(0.001)
          assert "db" in timer.phases
          assert timer.phases["db"] >= 1.0, timer.phases
          assert timer.total_ms >= timer.phases["db"]
          print(timer.phases)
          PY

      - name: Fixture count cache regression
        if: hashFiles('tests/unit/test_fixture_count_cache.py') != ''
        run: python -m pytest -q tests/unit/test_fixture_count_cache.py

      - name: Transfer horizon regression
        if: hashFiles('tests/unit/test_transfer_horizon_bulk_predictions.py') != ''
        run: python -m pytest -q tests/unit/test_transfer_horizon_bulk_predictions.py

      - name: Captain recommendation regression
        if: hashFiles('tests/unit/test_captain_recommendation_id.py') != ''
        run: python -m pytest -q tests/unit/test_captain_recommendation_id.py

      - name: Decision bridge import smoke test
        run: python -c "from fpl_intelligence.squad.bridge import DecisionOptimizerBridge; print(DecisionOptimizerBridge.__name__)"
name: One-shot batch Phase 2 history
on:
  push:
    branches:
      - perf/decisions-batch-phase2-history-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Batch Phase 2 history access
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/fpl_intelligence/api/routes/squad.py')
          s = p.read_text()
          old = '''    from fpl_intelligence.models.ensemble_xpts import (
        calculate_ensemble_xpts,
        collect_player_inputs,
    )'''
          new = '''    from fpl_intelligence.models.ensemble_xpts import (
        calculate_ensemble_xpts,
        collect_player_inputs_batch,
    )'''
          if old not in s:
              raise SystemExit('phase2 ensemble import block not found')
          s = s.replace(old, new, 1)

          old = '''    from types import SimpleNamespace

    from fpl_intelligence.models.ensemble_xpts import get_points_history

    watch_ids = (
        set(report.starting_xi)
        | ({int(report.captain.player_id)} if report.captain else set())
        or set(squad_ids)
    )'''
          new = '''    from types import SimpleNamespace

    watch_ids = (
        set(report.starting_xi)
        | ({int(report.captain.player_id)} if report.captain else set())
        or set(squad_ids)
    )'''
          if old not in s:
              raise SystemExit('phase2 watch import block not found')
          s = s.replace(old, new, 1)

          old = '''    # --- 2.1 ensemble xPTS (with confidence interval) for the starting XI ----
    ensemble: dict[str, Any] = {}
    for el in sorted(watch_ids):
        internal = id_map.get(el)
        data = collect_player_inputs(db, internal) if internal else {}
        data["baseline_xpts"] = xpts_all.get(el)
        # FDR per element is not materialized yet → factor drops out honestly
        # and weights renormalise inside the model.
        stub = SimpleNamespace(fixture_difficulty=None)
        ensemble[str(el)] = calculate_ensemble_xpts(stub, gameweek, data)'''
          new = '''    # Batch all watched-player histories once. The previous loop executed one
    # history query per player, then captain confidence executed another query
    # for the captain. This keeps the exact same inputs while collapsing those
    # repeated database round-trips to a single history query.
    history_by_internal = collect_player_inputs_batch(
        db, [pid for pid in id_map.values()]
    )

    # --- 2.1 ensemble xPTS (with confidence interval) for the starting XI ----
    ensemble: dict[str, Any] = {}
    for el in sorted(watch_ids):
        internal = id_map.get(el)
        data = dict(history_by_internal.get(internal, {})) if internal else {}
        data["baseline_xpts"] = xpts_all.get(el)
        # FDR per element is not materialized yet → factor drops out honestly
        # and weights renormalise inside the model.
        stub = SimpleNamespace(fixture_difficulty=None)
        ensemble[str(el)] = calculate_ensemble_xpts(stub, gameweek, data)'''
          if old not in s:
              raise SystemExit('ensemble loop block not found')
          s = s.replace(old, new, 1)

          old = '''    if top_el is not None and top_el in xpts_all:
        internal = id_map.get(top_el)
        hist = get_points_history(db, internal) if internal else []
        recent5 = hist[-5:]'''
          new = '''    if top_el is not None and top_el in xpts_all:
        internal = id_map.get(top_el)
        hist = (history_by_internal.get(internal, {}) if internal else {}).get(
            "points_history", []
        )
        recent5 = hist[-5:]'''
          if old not in s:
              raise SystemExit('captain history block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          python -m compileall -q src/fpl_intelligence/api/routes/squad.py
          python -m pytest -q tests/unit/test_phase15_live_prediction_route.py tests/unit/test_phase15_3_cache_behavior.py tests/optimization/test_optimization.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fpl_intelligence/api/routes/squad.py
          git commit -m 'perf(decisions): batch Phase 2 player history queries'
          git push origin HEAD:${{ github.ref_name }}
          git rm .github/workflows/_one_shot_batch_history.yml
          git commit -m 'chore(ci): remove one-shot batch history runner'
          git push origin HEAD:${{ github.ref_name }}

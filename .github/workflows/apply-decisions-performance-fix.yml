name: Apply decisions performance fix

on:
  push:
    branches:
      - perf/decisions-n-plus-one

permissions:
  contents: write

jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, '[bot] optimize decisions')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply verified performance patches
        shell: python
        run: |
          from pathlib import Path

          live = Path('src/fpl_intelligence/prediction/live_provider.py')
          text = live.read_text(encoding='utf-8')

          anchor = '        self._chain_cache: dict[int, PredictionChainResult] = {}\n'
          replacement = anchor + '        #: Per-request cache of fully materialized player predictions.\n        #: Optimizers ask for the same player/gameweek repeatedly; keeping the\n        #: object avoids rebuilding NumPy distributions thousands of times.\n        self._prediction_cache: dict[tuple[int, int], PlayerPrediction] = {}\n'
          if 'self._prediction_cache:' not in text:
              if anchor not in text:
                  raise SystemExit('live_provider.py: chain cache anchor not found')
              text = text.replace(anchor, replacement, 1)

          old = '''            pred = _make_prediction(\n                pid,\n                result.gameweek,\n                float(xp),\n                expected_minutes=float(extras.get("minutes", defaults["minutes"])),\n                start_probability=float(extras.get("start", defaults["start"])),\n                source=source,\n                data_quality=quality,\n                confidence=float(extras.get("conf", defaults["conf"])),\n                data_completeness=float(extras.get("compl", defaults["compl"])),\n            )\n'''
          new = '''            cache_key = (int(result.gameweek), int(pid))\n            cached = self._prediction_cache.get(cache_key)\n            if cached is not None:\n                predictions[pid] = cached\n                continue\n\n            pred = _make_prediction(\n                pid,\n                result.gameweek,\n                float(xp),\n                expected_minutes=float(extras.get("minutes", defaults["minutes"])),\n                start_probability=float(extras.get("start", defaults["start"])),\n                source=source,\n                data_quality=quality,\n                confidence=float(extras.get("conf", defaults["conf"])),\n                data_completeness=float(extras.get("compl", defaults["compl"])),\n            )\n'''
          if old not in text:
              raise SystemExit('live_provider.py: prediction construction anchor not found')
          text = text.replace(old, new, 1)

          anchor2 = '            predictions[pid] = pred\n        return predictions\n'
          replacement2 = '            predictions[pid] = pred\n            self._prediction_cache[cache_key] = pred\n        return predictions\n'
          if replacement2 not in text:
              if anchor2 not in text:
                  raise SystemExit('live_provider.py: prediction assignment anchor not found')
              text = text.replace(anchor2, replacement2, 1)

          live.write_text(text, encoding='utf-8')

          squad = Path('src/fpl_intelligence/api/routes/squad.py')
          text = squad.read_text(encoding='utf-8')

          anchor3 = '    details: dict[str, PlayerDetail] = {}\n'
          replacement3 = '''    # Batch-resolve player rows once. The old implementation issued one\n    # SELECT per player in the report, turning dashboard enrichment into an\n    # N+1 database pattern on every uncached decisions request.\n    players_by_element: dict[int, Player] = {}\n    try:\n        if player_ids:\n            rows = db.scalars(\n                select(Player).where(Player.fpl_element_id.in_(player_ids))\n            ).all()\n            players_by_element = {\n                int(row.fpl_element_id): row\n                for row in rows\n                if row.fpl_element_id is not None\n            }\n    except Exception as exc:  # noqa: BLE001 - enrichment remains best-effort\n        logger.debug("batched player enrichment query failed: %s", exc)\n\n    details: dict[str, PlayerDetail] = {}\n'''
          if 'players_by_element: dict[int, Player]' not in text:
              if anchor3 not in text:
                  raise SystemExit('squad.py: details anchor not found')
              text = text.replace(anchor3, replacement3, 1)

          old3 = '''        player: Player | None = db.scalar(select(Player).where(Player.fpl_element_id == pid))\n        if player is None:\n            # Legacy fallback for rows seeded before the element-id migration:\n'''
          new3 = '''        player: Player | None = players_by_element.get(int(pid))\n        if player is None:\n            # Legacy fallback for rows seeded before the element-id migration:\n'''
          if old3 not in text:
              raise SystemExit('squad.py: per-player SELECT anchor not found')
          text = text.replace(old3, new3, 1)

          squad.write_text(text, encoding='utf-8')
          print('verified performance patches applied')

      - name: Compile touched modules
        run: python -m compileall -q src/fpl_intelligence/prediction/live_provider.py src/fpl_intelligence/api/routes/squad.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fpl_intelligence/prediction/live_provider.py src/fpl_intelligence/api/routes/squad.py
          git diff --cached --check
          git commit -m '[bot] optimize decisions N+1 and prediction reuse'
          git push origin HEAD:perf/decisions-n-plus-one

name: Locked 2025-26 Holdout Evaluation

on:
  push:
    branches:
      - feature/intelligence-validation
    paths:
      - holdout-evaluation.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: python -m pip install ".[dev]"

      - name: Materialize locked 2025-26 observations
        run: python scripts/backfill_holdout_2025_26.py

      - name: Verify locked observation layer
        run: python scripts/backfill_holdout_2025_26.py --verify-only

      - name: Evaluate frozen holdout twice
        run: |
          python scripts/evaluate_locked_holdout.py --output /tmp/holdout-1.json
          python scripts/evaluate_locked_holdout.py --output /tmp/holdout-2.json
          cmp -- /tmp/holdout-1.json /tmp/holdout-2.json

      - name: Upload locked holdout artifact
        uses: actions/upload-artifact@v7
        with:
          name: locked-2025-26-holdout
          if-no-files-found: error
          path: /tmp/holdout-1.json

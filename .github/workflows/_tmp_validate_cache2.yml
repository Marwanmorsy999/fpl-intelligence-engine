name: temporary final cache validation

on:
  push:
    branches:
      - perf/bounded-decisions-cache-final

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: python -m pip install ".[dev]"
      - name: Compile source
        run: python -m compileall -q src
      - name: Ruff
        run: python -m ruff check src/fpl_intelligence/api/routes/squad.py tests/unit/test_decisions_cache.py
      - name: Cache tests
        run: python -m pytest -q tests/unit/test_decisions_cache.py

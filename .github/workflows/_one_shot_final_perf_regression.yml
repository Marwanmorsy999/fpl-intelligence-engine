name: One-shot final perf regression
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  regression:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Prediction provider regression
        run: python -m pytest -q tests/unit/test_phase15_live_prediction_route.py tests/unit/test_phase15_3_cache_behavior.py
      - name: Optimization regression
        run: python -m pytest -q tests/optimization/test_optimization.py
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_one_shot_final_perf_regression.yml
          git commit -m 'chore(ci): remove one-shot final perf regression'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

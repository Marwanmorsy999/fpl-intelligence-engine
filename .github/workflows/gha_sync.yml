name: Transfer Sync (Manual Production)

# Preview branch safety: this workflow must never silently mutate production.
# The normal daily production work is owned by the single Vercel Cron on main.
# This Actions workflow is an incident/recovery tool only and requires an
# explicit production confirmation when dispatched.
on:
  workflow_dispatch:
    inputs:
      confirm_production_sync:
        description: "Explicitly authorize a production transfer sync run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-transfer-sync
  cancel-in-progress: false

jobs:
  transfer-sync:
    if: ${{ inputs.confirm_production_sync == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Verify production ref
        run: |
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse --abbrev-ref HEAD)" = "main"
          echo "Running production sync from $(git rev-parse HEAD)"

      - name: Run transfer auto-detection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_BASE_URL: ${{ secrets.FPL_BASE_URL }}
        run: python scripts/gha_sync.py

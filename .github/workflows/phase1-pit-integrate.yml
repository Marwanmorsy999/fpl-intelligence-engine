name: Phase 1 PIT contract integration
on:
  push:
    branches: [fix/phase1-final]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire PIT contracts and timestamp semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          mat = Path('src/fpl_intelligence/availability/historical/materialize_pit.py')
          text = mat.read_text(encoding='utf-8')
          if 'from fpl_intelligence.availability.historical.pit_contract import' not in text:
              anchor = 'from fpl_intelligence.availability.historical.pit_fplcache import (\n'
              text = text.replace(anchor, 'from fpl_intelligence.availability.historical.pit_contract import (\n    validate_import_result,\n    validate_pit_events,\n)\n' + anchor, 1)
          old = '''    provider = _StaticEventProvider(by_season)\n    result = import_historical_availability(db, provider, list(by_season), strict_backtest_safe=strict_backtest_safe)\n    report.dry_run = False\n    report.import_result = result.to_dict()\n    return report.import_result\n'''
          new = '''    all_events = [event for snapshot in report.snapshots for event in snapshot.events]\n    cutoffs = {\n        (snapshot.cutoff.season_code, snapshot.cutoff.gameweek): snapshot.cutoff.cutoff\n        for snapshot in report.snapshots\n    }\n    pit_counts = validate_pit_events(all_events, cutoffs=cutoffs)\n    provider = _StaticEventProvider(by_season)\n    result = import_historical_availability(db, provider, list(by_season), strict_backtest_safe=strict_backtest_safe)\n    import_counts = validate_import_result(result)\n    report.dry_run = False\n    report.import_result = {\n        **result.to_dict(),\n        "pit_contract": pit_counts,\n        "import_contract": import_counts,\n    }\n    return report.import_result\n'''
          if old not in text:
              raise SystemExit('materialize import block not found')
          mat.write_text(text.replace(old, new, 1), encoding='utf-8')

          imp = Path('src/fpl_intelligence/availability/historical/importer.py')
          text = imp.read_text(encoding='utf-8')
          old2 = '''                valid_from=timestamps.published_at\n                or timestamps.available_at\n                or timestamps.event_time\n                or datetime.now(UTC),\n'''
          new2 = '''                valid_from=timestamps.published_at\n                or timestamps.available_at\n                or timestamps.event_time\n'''
          if old2 not in text:
              raise SystemExit('historical event valid_from fallback not found')
          imp.write_text(text.replace(old2, new2, 1), encoding='utf-8')
          PY
      - name: Add PIT contract tests
        run: |
          set -euo pipefail
          cat > tests/unit/test_pit_contract.py <<'PY'
          from __future__ import annotations

          from datetime import UTC, datetime, timedelta

          import pytest

          from fpl_intelligence.availability.historical.pit_contract import validate_pit_events
          from fpl_intelligence.availability.historical.temporal import AvailabilityTimestamps

          def event(at):
              return {
                  'provider': 'fplcache_pit',
                  'season_code': '2025-26',
                  'player_id': '1',
                  'provider_event_id': f'{at.isoformat()}:2025-26:1',
                  'gameweek': 2,
                  'snapshot_captured_at': at,
                  'timestamps': AvailabilityTimestamps(
                      event_time=None,
                      published_at=at,
                      available_at=at,
                      ingested_at=at + timedelta(minutes=1),
                  ),
              }

          def test_valid_event_passes_contract():
              at = datetime(2025, 8, 20, 10, tzinfo=UTC)
              result = validate_pit_events([event(at)], cutoffs={('2025-26', 2): at + timedelta(hours=1)})
              assert result == {'checked': 1, 'eligible_before_cutoff': 1, 'unique': 1}

          def test_duplicate_event_is_rejected():
              at = datetime(2025, 8, 20, 10, tzinfo=UTC)
              with pytest.raises(ValueError, match='duplicate PIT provider event'):
                  validate_pit_events([event(at), event(at)], cutoffs={('2025-26', 2): at + timedelta(hours=1)})

          def test_post_deadline_event_is_rejected():
              at = datetime(2025, 8, 20, 10, tzinfo=UTC)
              with pytest.raises(ValueError, match='post-deadline'):
                  validate_pit_events([event(at)], cutoffs={('2025-26', 2): at - timedelta(minutes=1)})

          def test_snapshot_and_available_at_must_match():
              at = datetime(2025, 8, 20, 10, tzinfo=UTC)
              bad = event(at)
              bad['timestamps'] = AvailabilityTimestamps(event_time=None, published_at=at, available_at=at + timedelta(minutes=1), ingested_at=at + timedelta(minutes=2))
              with pytest.raises(ValueError, match='available_at must equal snapshot capture time'):
                  validate_pit_events([bad], cutoffs={('2025-26', 2): at + timedelta(hours=1)})
          PY
      - name: Verify and commit
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/unit/test_gameweek_season_scope.py tests/unit/test_db_production_safety.py tests/unit/test_fpl_egress_resilience.py tests/unit/test_pit_contract.py tests/unit/test_phase9_2_ingestion.py
          python -m compileall -q src
          rm -f .github/workflows/phase1-pit-integrate.yml .github/workflows/phase1-repair.yml .github/workflows/phase1-final.yml .github/workflows/phase1-apply.yml .github/workflows/phase1-inspect.yml .github/workflows/phase1-diagnose.yml .github/workflows/phase1-correctness-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows
          git diff --cached --check
          git commit -m 'fix: formalize PIT contracts and historical timestamp provenance'
          git push origin HEAD:fix/phase1-final

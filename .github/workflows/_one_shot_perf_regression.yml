name: One-shot lightweight pool regression

on:
  push:
    branches:
      - perf/full-pool-lightweight-predictions
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Focused lightweight pool tests
        run: python -m pytest -q tests/unit/test_phase15_4_lightweight_pool.py
      - name: Prediction provider regression
        run: python -m pytest -q tests/unit/test_phase15_live_prediction_route.py tests/unit/test_phase15_3_cache_behavior.py
      - name: Optimization regression
        run: python -m pytest -q tests/optimization/test_optimization.py

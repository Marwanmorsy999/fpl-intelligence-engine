name: Phase 1 finalize
on:
  push:
    branches: [fix/phase1-final]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply historical timestamp fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/fpl_intelligence/availability/historical/importer.py')
          s = p.read_text(encoding='utf-8')
          old = '''                valid_from=timestamps.published_at\n                or timestamps.available_at\n                or timestamps.event_time\n                or datetime.now(UTC),\n'''
          new = '''                valid_from=timestamps.published_at\n                or timestamps.available_at\n                or timestamps.event_time\n'''
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/unit/test_gameweek_season_scope.py tests/unit/test_db_production_safety.py tests/unit/test_fpl_egress_resilience.py tests/unit/test_pit_contract.py tests/unit/test_phase9_2_ingestion.py
          python -m compileall -q src
      - name: Remove temporary workflows and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase1-finalize.yml .github/workflows/phase1-pit-integrate.yml .github/workflows/phase1-repair.yml .github/workflows/phase1-final.yml .github/workflows/phase1-apply.yml .github/workflows/phase1-inspect.yml .github/workflows/phase1-diagnose.yml .github/workflows/phase1-correctness-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows
          git diff --cached --check
          git commit -m 'fix: enforce historical timestamp and PIT contracts'
          git push origin HEAD:fix/phase1-final

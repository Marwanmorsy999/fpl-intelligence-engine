name: Historical Model Validation

on:
  push:
    branches:
      - feature/intelligence-validation
  workflow_dispatch:
    inputs:
      validation_target:
        description: Validation target
        required: true
        type: choice
        options:
          - all
          - minutes
          - team_strength
          - locked_holdout
        default: all
      report_name:
        description: Optional artifact name suffix
        required: false
        type: string
        default: historical-model-validation

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !((github.event_name == 'push' && contains(github.event.head_commit.message, 'trigger locked 2025-26 holdout evaluation')) || (github.event_name == 'workflow_dispatch' && inputs.validation_target == 'locked_holdout')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VALIDATION_TARGET: ${{ inputs.validation_target || 'all' }}
    steps:
      - name: Checkout selected validation branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: python -m pip install ".[dev]"

      - name: Run Team Strength unit tests
        run: python -m pytest tests/unit/test_team_strength_engine.py -q

      - name: Read-only preflight
        run: python scripts/preflight_minutes_validation.py

      - name: Validate minutes walk-forward
        if: ${{ inputs.validation_target == 'minutes' || inputs.validation_target == 'all' || github.event_name == 'push' }}
        run: |
          python scripts/evaluate_minutes_walkforward.py --report docs/STAGE_2A_MINUTES_VALIDATION.md
          python scripts/evaluate_minutes_walkforward.py --report /tmp/STAGE_2A_MINUTES_VALIDATION.rerun.md
          cmp -- docs/STAGE_2A_MINUTES_VALIDATION.md /tmp/STAGE_2A_MINUTES_VALIDATION.rerun.md

      - name: Validate team strength
        if: ${{ inputs.validation_target == 'team_strength' || inputs.validation_target == 'all' || github.event_name == 'push' }}
        run: |
          python scripts/evaluate_team_strength.py
          python scripts/evaluate_team_strength.py --output /tmp/stage-2b1-evaluation.rerun.json
          cmp -- data/experiments/team_strength/stage-2b1-evaluation.json /tmp/stage-2b1-evaluation.rerun.json

      - name: Add reproducibility metadata
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "python_version": platform.python_version(),
              "minutes_model_version": "2.0.0",
              "minutes_feature_version": "2.0.0",
              "team_strength_model_version": "2.0.0",
              "team_strength_feature_version": "team-strength-2.0.0",
              "dataset": "canonical_historical_performance",
              "validation_seasons": ["2022-23", "2023-24", "2024-25"],
              "temporal_policy": "strict_reproducibility",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "validation_target": os.environ["VALIDATION_TARGET"],
          }
          minutes_report = Path("docs/STAGE_2A_MINUTES_VALIDATION.md")
          if minutes_report.exists():
              minutes_report.write_text(
                  "## Run metadata\n\n"
                  + "\n".join(f"- {key}: `{value}`" for key, value in metadata.items())
                  + "\n\n"
                  + minutes_report.read_text(encoding="utf-8"),
                  encoding="utf-8",
              )
          team_report = Path("data/experiments/team_strength/stage-2b1-evaluation.json")
          if team_report.exists():
              report = json.loads(team_report.read_text(encoding="utf-8"))
              report["validation_metadata"] = metadata
              team_report.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload minutes validation report
        if: ${{ inputs.validation_target == 'minutes' || inputs.validation_target == 'all' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.report_name || 'historical-model-validation' }}-minutes
          if-no-files-found: error
          path: docs/STAGE_2A_MINUTES_VALIDATION.md

      - name: Upload team-strength validation report
        if: ${{ inputs.validation_target == 'team_strength' || inputs.validation_target == 'all' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.report_name || 'historical-model-validation' }}-team-strength
          if-no-files-found: error
          path: data/experiments/team_strength/stage-2b1-evaluation.json

  locked_holdout:
    name: Locked 2025-26 holdout
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, 'trigger locked 2025-26 holdout evaluation')) || (github.event_name == 'workflow_dispatch' && inputs.validation_target == 'locked_holdout') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: python -m pip install ".[dev]"

      - name: Materialize locked 2025-26 observations
        run: python scripts/backfill_holdout_2025_26.py

      - name: Verify locked observation layer read-only
        run: python scripts/backfill_holdout_2025_26.py --verify-only

      - name: Evaluate frozen holdout twice
        run: |
          python scripts/evaluate_locked_holdout.py --output /tmp/holdout-1.json
          python scripts/evaluate_locked_holdout.py --output /tmp/holdout-2.json
          cmp -- /tmp/holdout-1.json /tmp/holdout-2.json

      - name: Upload locked holdout artifact
        uses: actions/upload-artifact@v7
        with:
          name: locked-2025-26-holdout
          if-no-files-found: error
          path: /tmp/holdout-1.json

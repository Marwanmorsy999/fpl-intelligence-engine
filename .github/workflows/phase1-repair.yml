name: Phase 1 repair
on:
  push:
    branches: [fix/phase1-final]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime hardening
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          live = Path('src/fpl_intelligence/prediction/live_provider.py')
          text = live.read_text(encoding='utf-8')
          helper = '''def _resolve_gameweek_id(db: Session, gameweek: int) -> int | None:\n    """Resolve a provider gameweek to the newest available season row."""\n    from fpl_intelligence.db.models import Gameweek, Season\n\n    return db.execute(\n        select(Gameweek.id)\n        .join(Season, Gameweek.season_id == Season.id)\n        .where(Gameweek.provider_event_id == int(gameweek))\n        .order_by(Season.code.desc())\n        .limit(1)\n    ).scalar_one_or_none()\n\n\n'''
          if '_resolve_gameweek_id' not in text:
              i = text.find('def _fixtures_for_gameweek')
              if i < 0: raise SystemExit('fixture helper missing')
              text = text[:i] + helper + text[i:]
          old = '''gw_row = self.session.execute(\n            select(Gameweek.id).where(Gameweek.provider_event_id == int(gameweek))\n        ).scalar_one_or_none()'''
          if old in text:
              text = text.replace(old, 'gw_row = _resolve_gameweek_id(self.session, int(gameweek))', 1)
          s = text.find('def _fixtures_for_gameweek')
          e = text.find('\n\ndef _team_names', s)
          if s < 0 or e < 0: raise SystemExit('fixture helper bounds missing')
          replacement = '''def _fixtures_for_gameweek(db: Session, gameweek: int) -> list[dict[str, int]]:\n    """Resolve fixtures for the newest season containing ``gameweek``."""\n    from fpl_intelligence.db.models import Fixture\n\n    gw_id = _resolve_gameweek_id(db, int(gameweek))\n    if gw_id is None:\n        return []\n    rows = db.execute(\n        select(Fixture.home_team_id, Fixture.away_team_id)\n        .where(Fixture.gameweek_id == gw_id)\n    ).all()\n    return [{"home_team_id": int(home), "away_team_id": int(away)} for home, away in rows]\n'''
          text = text[:s] + replacement + text[e:]
          live.write_text(text, encoding='utf-8')

          sync = Path('src/fpl_intelligence/sync/service.py')
          s = sync.read_text(encoding='utf-8')
          old_sync = 'row = db.scalar(select(Gameweek).where(Gameweek.provider_event_id == gameweek))'
          new_sync = '''season = _get_or_create_season(db)\n    row = db.scalar(\n        select(Gameweek).where(\n            Gameweek.season_id == season.id,\n            Gameweek.provider_event_id == gameweek,\n        )\n    )'''
          if old_sync in s:
              s = s.replace(old_sync, new_sync, 1)
          sync.write_text(s, encoding='utf-8')

          dbs = Path('src/fpl_intelligence/db/session.py')
          d = dbs.read_text(encoding='utf-8')
          if 'import os\n' not in d.split('from collections.abc', 1)[0]:
              d = d.replace('from collections.abc import Generator\n', 'import os\n\nfrom collections.abc import Generator\n', 1)
          if 'def _is_production_runtime' not in d:
              d = d.replace('def _effective_database_url() -> str:\n', 'def _is_production_runtime() -> bool:\n    return settings.app_env.lower() == "production" or os.getenv("VERCEL") == "1" or os.getenv("VERCEL_ENV") == "production"\n\n\ndef _effective_database_url() -> str:\n', 1)
          old_db = '''    url = settings.database_url\n    if url == _DEFAULT_PG_PLACEHOLDER and settings.app_env != "production":\n        return _DEFAULT_DEV_SQLITE\n    return _normalize_postgres_driver(url)\n'''
          new_db = '''    url = settings.database_url.strip()\n    if url == _DEFAULT_PG_PLACEHOLDER or url.startswith("sqlite"):\n        if _is_production_runtime():\n            raise RuntimeError("Production requires an explicit PostgreSQL DATABASE_URL; SQLite/dev fallback is disabled.")\n        if url == _DEFAULT_PG_PLACEHOLDER:\n            return _DEFAULT_DEV_SQLITE\n    return _normalize_postgres_driver(url)\n'''
          if old_db in d:
              d = d.replace(old_db, new_db, 1)
          dbs.write_text(d, encoding='utf-8')

          egress = Path('src/fpl_intelligence/data_providers/fpl_egress.py')
          e = egress.read_text(encoding='utf-8')
          if 'stale_if_error_ttl' not in e:
              e = e.replace('        monotonic_clock: Callable[[], float] | None = None,\n    ) -> None:', '        monotonic_clock: Callable[[], float] | None = None,\n        stale_if_error_ttl: float = 900.0,\n    ) -> None:', 1)
              e = e.replace('        self._cache_ttl = float(cache_ttl)\n', '        self._cache_ttl = float(cache_ttl)\n        self._stale_if_error_ttl = max(0.0, float(stale_if_error_ttl))\n', 1)
              e = e.replace('''        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                if self._now() - ts < self._cache_ttl:\n                    logger.debug("fpl_egress: cache hit %s", full_path)\n                    return data\n''', '''        stale_candidate = None\n        stale_age = None\n        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                age = self._now() - ts\n                if age < self._cache_ttl:\n                    logger.debug("fpl_egress: cache hit %s", full_path)\n                    return data\n                if age <= self._cache_ttl + self._stale_if_error_ttl:\n                    stale_candidate = data\n                    stale_age = age\n''', 1)
              e = e.replace('        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_text(', '        if stale_candidate is not None:\n            logger.warning("fpl_egress: all strategies failed for %s; serving stale cache age=%.1fs", full_path, stale_age or 0.0)\n            self._winning_strategy = "stale-cache"\n            return stale_candidate\n        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_text(', 1)
              e = e.replace('''        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                if self._now() - ts < self._cache_ttl:\n                    logger.debug("fpl_egress: text cache hit %s", full_path)\n                    return data\n\n        url = f"{self._base_url}{full_path}"\n''', '''        stale_candidate = None\n        stale_age = None\n        if use_cache:\n            cached = self._cache.get(cache_key)\n            if cached:\n                ts, data = cached\n                age = self._now() - ts\n                if age < self._cache_ttl:\n                    logger.debug("fpl_egress: text cache hit %s", full_path)\n                    return data\n                if age <= self._cache_ttl + self._stale_if_error_ttl:\n                    stale_candidate = data\n                    stale_age = age\n\n        url = f"{self._base_url}{full_path}"\n''', 1)
              e = e.replace('        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_with_client(', '        if stale_candidate is not None:\n            logger.warning("fpl_egress: all text strategies failed for %s; serving stale cache age=%.1fs", full_path, stale_age or 0.0)\n            self._winning_strategy = "stale-cache"\n            return stale_candidate\n        raise FplEgressExhaustedError(full_path, attempts)\n\n    async def fetch_with_client(', 1)
              e = e.replace('''        return [\n            ("allorigins", self._allorigins),\n            ("corsproxy", self._corsproxy),\n            ("codetabs", self._codetabs),\n            ("env_proxy", self._env_proxy),\n        ]''', '''        return [\n            ("env_proxy", self._env_proxy),\n            ("allorigins", self._allorigins),\n            ("corsproxy", self._corsproxy),\n            ("codetabs", self._codetabs),\n        ]''', 1)
              e = e.replace('''        strategies: list[tuple[str, Callable[[str], Any]]] = [\n            ("direct", self._direct_text),\n            ("allorigins", _allorigins_text),\n            ("corsproxy", _corsproxy_text),\n            ("codetabs", _codetabs_text),\n            ("env_proxy", _env_proxy_text),\n        ]''', '''        strategies: list[tuple[str, Callable[[str], Any]]] = [\n            ("direct", self._direct_text),\n            ("env_proxy", _env_proxy_text),\n            ("allorigins", _allorigins_text),\n            ("corsproxy", _corsproxy_text),\n            ("codetabs", _codetabs_text),\n        ]''', 1)
          egress.write_text(e, encoding='utf-8')
          PY
      - name: Add regression tests
        run: |
          set -euo pipefail
          cat > tests/unit/test_db_production_safety.py <<'PY'
          from __future__ import annotations

          import pytest

          from fpl_intelligence.db import session as db_session

          def test_production_rejects_default_or_sqlite_database(monkeypatch):
              monkeypatch.setattr(db_session.settings, 'app_env', 'production')
              monkeypatch.delenv('VERCEL', raising=False)
              monkeypatch.delenv('VERCEL_ENV', raising=False)
              monkeypatch.setattr(db_session.settings, 'database_url', db_session._DEFAULT_PG_PLACEHOLDER)
              with pytest.raises(RuntimeError, match='Production requires an explicit PostgreSQL DATABASE_URL'):
                  db_session._effective_database_url()
              monkeypatch.setattr(db_session.settings, 'database_url', 'sqlite:///tmp/fpl.db')
              with pytest.raises(RuntimeError, match='Production requires an explicit PostgreSQL DATABASE_URL'):
                  db_session._effective_database_url()

          def test_development_keeps_sqlite_fallback(monkeypatch):
              monkeypatch.setattr(db_session.settings, 'app_env', 'development')
              monkeypatch.delenv('VERCEL', raising=False)
              monkeypatch.delenv('VERCEL_ENV', raising=False)
              monkeypatch.setattr(db_session.settings, 'database_url', db_session._DEFAULT_PG_PLACEHOLDER)
              assert db_session._effective_database_url().startswith('sqlite:///')
          PY
          cat > tests/unit/test_fpl_egress_resilience.py <<'PY'
          from __future__ import annotations

          import asyncio

          from fpl_intelligence.data_providers.fpl_egress import FplEgressChain

          def test_recent_stale_cache_survives_provider_exhaustion():
              now = 1000.0
              chain = FplEgressChain('https://example.invalid', cache_ttl=60, stale_if_error_ttl=900, monotonic_clock=lambda: now)
              chain._cache['/bootstrap'] = (900.0, {'elements': [{'id': 1}]})

              async def fail(_url):
                  raise RuntimeError('upstream unavailable')

              chain._strategies = lambda: [('direct', fail)]
              result = asyncio.run(chain.fetch('/bootstrap'))
              assert result == {'elements': [{'id': 1}]}
              assert chain.winning_strategy == 'stale-cache'
          PY
      - name: Verify
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/unit/test_gameweek_season_scope.py tests/unit/test_db_production_safety.py tests/unit/test_fpl_egress_resilience.py
          python -m compileall -q src
          python -m pytest -q tests/unit/test_phase9_2_ingestion.py
      - name: Commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase1-repair.yml .github/workflows/phase1-final.yml .github/workflows/phase1-apply.yml .github/workflows/phase1-inspect.yml .github/workflows/phase1-diagnose.yml .github/workflows/phase1-correctness-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows
          git diff --cached --check
          git commit -m 'fix: harden production correctness and FPL egress'
          git push origin HEAD:fix/phase1-final

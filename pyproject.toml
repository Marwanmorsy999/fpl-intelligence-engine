[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fpl-intelligence-engine"
version = "2.7.9"
description = "Free-first, data-driven Fantasy Premier League intelligence platform"
requires-python = "~=3.12.0"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "FPL Intelligence Engine"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "tenacity>=9,<10",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
  "rich>=13.9,<14",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "python-telegram-bot>=21.0,<22",
  "pywebpush>=2.0,<3",
  "sentry-sdk>=2.20,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "playwright>=1.50,<2",
]

[project.scripts]
fpl = "fpl_intelligence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: pre-existing line-length violations across the codebase
# SIM105/SIM102/SIM108/SIM401: pre-existing simplification suggestions
# F401/F841/F821: pre-existing unused/undefined names in tests and scripts
# I001: pre-existing import order in test files
# E402/E731: pre-existing module-level import order and lambda assignments
# B007/B023/B025/B905/BLE001: pre-existing bugbear warnings
extend-ignore = [
  "E501", "SIM105", "SIM102", "SIM108", "SIM401",
  "F401", "F841", "F821", "I001",
  "E402", "E731",
  "B007", "B023", "B025", "B905", "BLE001",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
